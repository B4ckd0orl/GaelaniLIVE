name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout GaelaniLIVE
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 cmake ninja-build wget unzip git

      - name: PS5 Payload SDK (release)
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -O /tmp/ps5sdk.zip
          sudo unzip -q -o /tmp/ps5sdk.zip -d /opt
          test -d /opt/ps5-payload-sdk && echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: OnionHEN v0.9.0-beta2
        run: |
          git clone --depth 1 --branch v0.9.0-beta2 \
            https://github.com/aydencharles/onionHEN.git "$HOME/onionHEN-beta2"
          cd "$HOME/onionHEN-beta2"
          # Non-recursive: nested BearSSL rejects shallow SHA fetches; kstuff.elf
          # comes prebuilt from sync_dependencies.sh anyway.
          git submodule update --init --depth 1
          echo "ONIONHEN=$HOME/onionHEN-beta2" >> "$GITHUB_ENV"

      - name: Sync OnionHEN dependencies (kstuff etc.)
        run: |
          cd "$ONIONHEN"
          export PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          ./scripts/sync_dependencies.sh
          test -s .cache/dependencies/kstuff.elf

      - name: Inject GaelaniLIVE into OnionHEN tree
        run: |
          DEST="$ONIONHEN/source/gaelanilive"
          mkdir -p "$DEST"
          cp src/*.cpp src/*.hpp src/*.c src/*.h src/*.html src/CMakeLists.txt "$DEST/"
          cp assets/icon0.png "$DEST/icon0.png"
          grep -q '^add_subdirectory(gaelanilive)' "$ONIONHEN/source/CMakeLists.txt" \
            || echo 'add_subdirectory(gaelanilive)' >> "$ONIONHEN/source/CMakeLists.txt"
          # util/daemon/bootstrapper/unpacker need libcurl in the SDK homebrew dir
          # (cheat catalog HTTP), which the SDK release zip does not ship.
          # GaelaniLIVE builds none of them, so skip configuring those dirs.
          sed -i -E 's@^add_subdirectory\((util|daemon|bootstrapper|unpacker)\)$@# skipped (needs libcurl): add_subdirectory(\1)@' \
            "$ONIONHEN/source/CMakeLists.txt"
          tail -6 "$ONIONHEN/source/CMakeLists.txt"

      - name: Configure
        run: |
          set -o pipefail
          export PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          export PATH="$PS5_PAYLOAD_SDK/bin:$PATH"
          export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="dev-${GITHUB_SHA:0:7}"
          fi
          echo "GAELANILIVE_VERSION=$VER"
          prospero-cmake -S "$ONIONHEN/source" -B "$ONIONHEN/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONIONHEN_KSTUFF_ELF="$ONIONHEN/.cache/dependencies/kstuff.elf" \
            -DPS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK" \
            -DGAELANILIVE_VERSION="$VER" \
            2>&1 | tee /tmp/configure.log | tail -40

      - name: Build gaelanilive.elf
        run: |
          export PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          export PATH="$PS5_PAYLOAD_SDK/bin:$PATH"
          cmake --build "$ONIONHEN/build" -j"$(nproc)" --target gaelanilive
          cp "$ONIONHEN/build/bin/gaelanilive.elf" "$GITHUB_WORKSPACE/gaelanilive.elf"
          cd "$GITHUB_WORKSPACE"
          sha256sum gaelanilive.elf > gaelanilive.elf.sha256
          cat gaelanilive.elf.sha256

      - name: Verify branding and version in ELF
        run: |
          python3 - <<'PY'
          import os, sys
          data = open('gaelanilive.elf', 'rb').read()
          must = [b'GaelaniLIVE', b'/data/GaelaniLIVE', b'gaelanilive.log']
          forbidden = [b'/data/' + b'Live' + b'Shell', b'/system_tmp/' + b'live' + b'shell']
          ok = True
          for m in must:
              if m not in data:
                  print('MISSING:', m.decode()); ok = False
          for f in forbidden:
              if f in data:
                  print('FORBIDDEN PRESENT:', f.decode()); ok = False
          ref = os.environ.get('GITHUB_REF', '')
          ver = os.environ['GITHUB_REF_NAME'] if ref.startswith('refs/tags/') \
              else 'dev-' + os.environ['GITHUB_SHA'][:7]
          if ver.encode() not in data:
              print('VERSION NOT EMBEDDED:', ver); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaelanilive-elf
          path: |
            gaelanilive.elf
            gaelanilive.elf.sha256

      # The release assets are not CORS-fetchable from a browser (no
      # Access-Control-Allow-Origin on release-assets.githubusercontent.com), so the
      # page downloads this mirror from raw.githubusercontent.com instead. Pushed
      # BEFORE the release so the mirror is in place when the tag goes public.
      - name: Publish CORS mirror (branch mirror)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -rf /tmp/mirror
          mkdir /tmp/mirror
          cp gaelanilive.elf /tmp/mirror/
          cd /tmp/mirror
          git init -q -b mirror
          git config user.name 'GaelaniLIVE CI'
          git config user.email 'ci@users.noreply.github.com'
          git add gaelanilive.elf
          git commit -qm "$GITHUB_REF_NAME"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror
          echo "mirror updated: $GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if (index($0, tag)) found = 1; next }
            found { print }
          ' CHANGELOG.md > /tmp/release_body.md
          if ! test -s /tmp/release_body.md; then cp CHANGELOG.md /tmp/release_body.md; fi
          head -20 /tmp/release_body.md

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gaelanilive.elf
            gaelanilive.elf.sha256
          body_path: /tmp/release_body.md
